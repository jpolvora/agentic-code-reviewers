# Agentic PR review for main — default engine cursor-sdk + composer-2.5.
# Runs via run.sh --local (current checkout, no release-branch clone).
# Optional OpenCode via workflow_dispatch (engine=opencode).
#
# Secrets:
#   cursor-sdk (default) → CURSOR_API_KEY
#   opencode (manual)    → OPENCODE_API_KEY
# Optional: AGENTIC_CODE_REVIEWERS_GITHUB_TOKEN (PAT) — resolveReviewThread; default github.token
name: Agentic Code Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: LLM engine (cursor-sdk or opencode)
        required: false
        default: cursor-sdk
        type: choice
        options: [cursor-sdk, opencode]
      model:
        description: LLM model (empty = engine default)
        required: false
        default: composer-2.5
        type: string
      pr_number:
        description: PR number (required for manual run)
        required: true
        type: string
      source_branch:
        description: Source branch (head ref)
        required: true
        type: string
      target_branch:
        description: Target branch (base ref)
        required: false
        default: main
        type: string
      diff_max_bytes:
        description: Diff cap size limit in bytes (empty = default 100000)
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

env:
  REVIEW_ENGINE: ${{ github.event.inputs.engine || 'cursor-sdk' }}
  REVIEW_MODEL: ${{ github.event.inputs.model || 'composer-2.5' }}
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  SOURCE_BRANCH: ${{ github.head_ref || github.event.inputs.source_branch }}
  TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.event.inputs.target_branch || 'main' }}
  DIFF_MAX_BYTES: ${{ github.event.inputs.diff_max_bytes || '' }}

jobs:
  review:
    name: Review (${{ env.REVIEW_ENGINE }})
    runs-on: ubuntu-latest

    concurrency:
      group: review-${{ env.REVIEW_ENGINE }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - if: env.REVIEW_ENGINE == 'cursor-sdk'
        run: npm run typecheck

      - name: Validate engine secret
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ "$REVIEW_ENGINE" = "cursor-sdk" ] && [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Configure secret CURSOR_API_KEY in Settings → Secrets (engine cursor-sdk)."
            exit 1
          fi
          if [ "$REVIEW_ENGINE" = "opencode" ] && [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Configure secret OPENCODE_API_KEY in Settings → Secrets (engine opencode)."
            exit 1
          fi

      - name: Run code reviewer
        env:
          AGENTIC_CODE_REVIEWERS_GITHUB_TOKEN: ${{ secrets.AGENTIC_CODE_REVIEWERS_GITHUB_TOKEN || github.token }}
          AGENTIC_CODE_REVIEWERS_ENGINE: ${{ env.REVIEW_ENGINE }}
          AGENTIC_CODE_REVIEWERS_MODEL: ${{ env.REVIEW_MODEL }}
          AGENTIC_CODE_REVIEWERS_REVIEW_SELF: 'true'
          AGENTIC_CODE_REVIEWERS_SCORE_MIN: '1'
          AGENTIC_CODE_REVIEWERS_DIFF_MAX_BYTES: ${{ env.DIFF_MAX_BYTES }}
          CURSOR_API_KEY: ${{ env.REVIEW_ENGINE == 'cursor-sdk' && secrets.CURSOR_API_KEY || '' }}
          OPENCODE_API_KEY: ${{ env.REVIEW_ENGINE == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
        run: |
          bash run.sh --local --gh \
            --pr-id "$PR_NUMBER" \
            --source-branch "$SOURCE_BRANCH" \
            --target-branch "$TARGET_BRANCH"
        continue-on-error: true
